<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>BlueprintViewer Demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #d8dee6;
        font: 13px/1.5 system-ui, sans-serif; }
      #app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr;
        height: 100%; gap: 8px; padding: 8px; box-sizing: border-box; }
      h1 { grid-column: 1 / -1; font-size: 15px; margin: 0; padding: 4px 2px; font-weight: 600; }
      #viewer { position: relative; min-height: 0; background: #000; border-radius: 6px; overflow: hidden; }
      #viewer canvas { display: block; }
      aside { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      fieldset { border: 1px solid #2a3340; border-radius: 6px; margin: 0; padding: 8px; }
      legend { font-size: 12px; color: #8fa1b3; padding: 0 4px; }
      label { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
      input[type=number] { width: 90px; background: #1a2129; color: #d8dee6;
        border: 1px solid #2a3340; border-radius: 4px; padding: 3px 6px; }
      textarea { width: 100%; height: 90px; box-sizing: border-box; resize: vertical;
        background: #1a2129; color: #d8dee6; border: 1px solid #2a3340; border-radius: 4px;
        padding: 6px; font: 11px/1.4 monospace; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; }
      button { background: #24303e; color: #d8dee6; border: 1px solid #35465a;
        border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
      button:hover { background: #2e3d4e; }
      #result { border-radius: 6px; padding: 8px; background: #1a2129; min-height: 32px;
        word-break: break-all; }
      #result.ok { border-left: 3px solid #3fb950; }
      #result.err { border-left: 3px solid #f85149; }
      #log { flex: 1; min-height: 80px; overflow-y: auto; background: #0d1117;
        border: 1px solid #2a3340; border-radius: 6px; padding: 8px;
        font: 11px/1.6 monospace; }
      #log .err { color: #f85149; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>BlueprintViewer Demo — <code>new BlueprintViewer({ container })</code> + <code>loadBlueprint(str)</code></h1>
      <div id="viewer"></div>
      <aside>
        <div id="result">（等待加载）</div>
        <fieldset>
          <legend>蓝图</legend>
          <textarea id="blueprint" placeholder="粘贴 BLUEPRINT:… 字符串"></textarea>
          <div class="btns">
            <button id="btnLoad">loadBlueprint</button>
            <button id="btnLoadJson">loadJson</button>
            <button id="btnLoadJsonFile">导入本地 JSON 文件</button>
            <button id="btnLoadFixture">载入 fixture</button>
            <button id="btnBadString">坏字符串</button>
          </div>
          <input type="file" id="jsonFile" accept=".json,application/json" style="display:none">
        </fieldset>
        <fieldset>
          <legend>RenderSettings</legend>
          <label><input type="checkbox" id="showRealModels" checked> showRealModels</label>
          <label><input type="checkbox" id="texturesEnabled" checked> texturesEnabled</label>
          <label>maxInstancesPerModel
            <input type="number" id="maxInstances" min="1" step="1" placeholder="Infinity"></label>
        </fieldset>
        <fieldset>
          <legend>选中 / 定位（对齐 v1 + focusBuilding）</legend>
          <div class="btns">
            <button id="btnSelect3">selectBuilding(3)</button>
            <button id="btnSelectNull">select(null)</button>
            <button id="btnFocus3">聚焦第3栋</button>
            <button id="btnFocusNull">取消定位</button>
          </div>
          <div class="btns">
            <button id="btnSelectedIndex">getSelectedIndex</button>
            <button id="btnBuildingInfo">getBuildingInfo(3)</button>
            <button id="btnCameraVersion">getCameraVersion</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>尺寸 / 画布</legend>
          <div class="btns">
            <button id="btnSetSize">setSize(400,300)</button>
            <button id="btnResetSize">resetSize</button>
            <button id="btnGetCanvas">getCanvas</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>主题 / 导出</legend>
          <div class="btns">
            <button id="btnThemeDark">dark</button>
            <button id="btnThemeLight">light</button>
            <button id="btnThemeAuto">auto</button>
            <button id="btnGetTheme">getTheme</button>
          </div>
          <div class="btns">
            <button id="btnDataURL">toDataURL</button>
            <button id="btnToBlob">toBlob</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>生命周期</legend>
          <div class="btns">
            <button id="btnCreate">new Viewer</button>
            <button id="btnResetCamera">resetCamera</button>
            <button id="btnGetData">getBlueprintData</button>
            <button id="btnDispose">dispose</button>
          </div>
        </fieldset>
        <div id="log"></div>
      </aside>
    </div>
    <!-- built files will be auto injected -->
  </body>
  <script>
    const { BlueprintViewer, parseBlueprint } = DSPBlueprintEditor;

        // 创建纯 3D 预览器（不依赖 Vue）
        const viewer = new BlueprintViewer({
            container: '#canvas',
            theme: 'dark',
        });

        const info = document.getElementById('info');
        const bpInput = document.getElementById('bpInput');

        // 加载蓝图
        function load() {
            const str = bpInput.value.trim();
            if (!str) return;
            try {
                viewer.loadBlueprint(str);
                const data = parseBlueprint(str);
                info.textContent = `${data.header.shortDesc} | ${data.buildings.length} 个建筑`;
            } catch (e) {
                info.textContent = '解析失败: ' + e.message;
            }
        }

        // 按钮事件
        document.getElementById('loadBtn').onclick = load;
        document.getElementById('resetBtn').onclick = () => viewer.resetCamera();

        // 页面加载时自动渲染
        load();
  </script>
</html>
